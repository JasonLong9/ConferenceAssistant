version: '3.8'

services:
  conference-assistant:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - HOST=0.0.0.0
      - PORT=8080
      - WHISPER_DEVICE=cpu  # 使用cpu或cuda
    volumes:
      - ./outputs:/app/outputs
      - ./models:/app/models
    restart: unless-stopped
    command: uvicorn web_service:app --host 0.0.0.0 --port 8080 --workers 1

  # 可选：添加nginx反向代理
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl  # SSL证书目录
    depends_on:
      - conference-assistant
    restart: unless-stopped
    profiles:
      - production

networks:
  default:
    name: conference-assistant-network